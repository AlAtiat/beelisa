name: Build and Release BeELISA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: beelisa-windows
          - os: macos-15
            artifact-name: beelisa-macos-arm64
          - os: macos-15-intel
            artifact-name: beelisa-macos-x86_64
          - os: ubuntu-latest
            artifact-name: beelisa-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Briefcase
        run: |
          python -m pip install -U pip
          python -m pip install -U briefcase

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      # --- Create ---
      - name: Create (Linux flatpak)
        if: runner.os == 'Linux'
        run: briefcase create linux flatpak



      - name: Create
        if: runner.os != 'Linux'
        run: briefcase create

      # --- Build ---
      - name: Build (Linux flatpak)
        if: runner.os == 'Linux'
        run: briefcase build linux flatpak

      - name: Build
        if: runner.os != 'Linux'
        run: briefcase build

      # --- Package ---
      - name: Package (macOS — ad-hoc sign, no Apple certificate required)
        if: runner.os == 'macOS'
        run: briefcase package --adhoc-sign

      - name: Package (Linux flatpak)
        if: runner.os == 'Linux'
        run: briefcase package linux flatpak

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: briefcase package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## ${VERSION}/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG \
            > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See CHANGELOG for full details." > release_notes.md
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BeELISA ${{ github.ref_name }}
          body_path: release_notes.md
          files: release-assets/*
          draft: false
          prerelease: false
