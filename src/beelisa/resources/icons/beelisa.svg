<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
  <!-- Bee-inspired gradient for ELISA stroke -->
<!-- Premium gold gradient for ELISA stroke -->
<linearGradient id="beeStrokeGrad"
                x1="120" y1="217"
                x2="390" y2="380"
                gradientUnits="userSpaceOnUse">


  <stop offset="100%" stop-color="#6E5312"/>

</linearGradient>

    <!-- Reverse bee gradient for wells -->
<!-- Subtle reverse metallic gradient for wells -->
<linearGradient id="beeWellGrad"
                x1="390" y1="380"
                x2="120" y2="217"
                gradientUnits="userSpaceOnUse">

  <stop offset="0%"   stop-color="#E9DFC6"/>
  <stop offset="35%"  stop-color="#D2C19A"/>
  <stop offset="65%"  stop-color="#B8A572"/>
  <stop offset="100%" stop-color="#8C7A4F"/>

</linearGradient>
    
    <!-- Inner well-field panel -->
    <linearGradient id="panelGrad" x1="122" y1="206" x2="390" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2F6"/>
      <stop offset="1" stop-color="#D9E0E8"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.18"/>
    </filter>

    <!-- Reusable well -->
    <circle id="well" r="5.2" />

    <!-- Clip path for watermark curve inside well panel -->
    <clipPath id="wellPanelClip">
      <rect x="122" y="206" width="268" height="186" rx="22"/>
    </clipPath>
  </defs>

  <!-- ONLY CHANGE: wrapper transform (bigger + centered to panel) -->
<g transform="translate(256 256) scale(1.88 2.18) translate(-256 -299)">
    <!-- Plate -->
    <g filter="url(#shadow)">
      <!-- Inner well-field panel -->
      <rect x="122" y="206" width="268" height="186" rx="22"
            fill="#FFFFFF" opacity="1"/>
    </g>

    <!-- 4PL watermark curve INSIDE well panel -->
    <g opacity="0.3" clip-path="url(#wellPanelClip)">
      <path d="M135 360
               C 180 360, 210 355, 235 345
               C 260 335, 270 315, 290 295
               C 315 270, 350 245, 385 230"
            fill="none"
            stroke="#111111"
            stroke-width="6"
            stroke-linecap="round"/>
      <!-- optional faint calibrant points -->
      <g fill="#F2F4F7" stroke="#111111" stroke-width="3">
        <circle cx="150" cy="360" r="7"/>
        <circle cx="195" cy="355" r="7"/>
        <circle cx="235" cy="345" r="7"/>
        <circle cx="290" cy="295" r="7"/>
        <circle cx="340" cy="255" r="7"/>
        <circle cx="385" cy="230" r="7"/>
      </g>
    </g>

    <!-- Subtle grid lines inside the well panel -->
    <g opacity="0.25" stroke="#9AA6B2" stroke-width="1">
      <!-- Vertical grid lines (12 columns) -->
      <line x1="144.33" y1="206" x2="144.33" y2="392"/>
      <line x1="166.67" y1="206" x2="166.67" y2="392"/>
      <line x1="189.00" y1="206" x2="189.00" y2="392"/>
      <line x1="211.33" y1="206" x2="211.33" y2="392"/>
      <line x1="233.67" y1="206" x2="233.67" y2="392"/>
      <line x1="256.00" y1="206" x2="256.00" y2="392"/>
      <line x1="278.33" y1="206" x2="278.33" y2="392"/>
      <line x1="300.67" y1="206" x2="300.67" y2="392"/>
      <line x1="323.00" y1="206" x2="323.00" y2="392"/>
      <line x1="345.33" y1="206" x2="345.33" y2="392"/>
      <line x1="367.67" y1="206" x2="367.67" y2="392"/>

      <!-- Horizontal grid lines (8 rows) -->
      <line x1="122" y1="229.25" x2="390" y2="229.25"/>
      <line x1="122" y1="252.50" x2="390" y2="252.50"/>
      <line x1="122" y1="275.75" x2="390" y2="275.75"/>
      <line x1="122" y1="299.00" x2="390" y2="299.00"/>
      <line x1="122" y1="322.25" x2="390" y2="322.25"/>
      <line x1="122" y1="345.50" x2="390" y2="345.50"/>
      <line x1="122" y1="368.75" x2="390" y2="368.75"/>
    </g>


            <!-- Bee replacing Row B, Col 6 -->
<!-- Bee replacing Row A, Col 6 (I top) -->
<g transform="translate(244.83 217.63) scale(0.9)">
  <ellipse cx="-6" cy="-7" rx="6" ry="4.5" fill="#111111" opacity="0.35"/>
  <ellipse cx="6" cy="-7" rx="6" ry="4.5" fill="#111111" opacity="0.35"/>
  <ellipse cx="0" cy="0" rx="5.5" ry="7.5" fill="#111111"/>
  <!-- stripes -->
  <rect x="-5.5" y="-2.5" width="11" height="2" fill="#FFC107"/>
  <rect x="-5.5" y="1.5" width="11" height="2" fill="#FFC107"/>
  <path d="M0 8 L-2 11 L2 11 Z" fill="#111111"/>
</g>
      
      


    <!-- Highlighted wells: ELISA -->
<!-- Highlighted wells: ELISA (spans full height A–H) -->
<g fill="url(#beeWellGrad)" opacity="0.95">  <!-- E (cols 1-3) -->
  <circle cx="133.17" cy="217.63" r="5.2"/><circle cx="155.50" cy="217.63" r="5.2"/><circle cx="177.83" cy="217.63" r="5.2"/>
  <circle cx="133.17" cy="240.88" r="5.2"/>
  <circle cx="133.17" cy="264.13" r="5.2"/>
<circle cx="133.17" cy="287.38" r="5.2"/><circle cx="155.50" cy="287.38" r="5.2"/><circle cx="177.83" cy="287.38" r="5.2"/>
<circle cx="133.17" cy="310.63" r="5.2"/> <circle cx="133.17" cy="310.63" r="5.2"/>
  <circle cx="133.17" cy="333.88" r="5.2"/>
  <circle cx="133.17" cy="357.13" r="5.2"/>
  <circle cx="133.17" cy="380.38" r="5.2"/><circle cx="155.50" cy="380.38" r="5.2"/><circle cx="177.83" cy="380.38" r="5.2"/>

  <!-- L (cols 4-5) -->
  <circle cx="200.17" cy="217.63" r="5.2"/>
  <circle cx="200.17" cy="240.88" r="5.2"/>
  <circle cx="200.17" cy="264.13" r="5.2"/>
  <circle cx="200.17" cy="287.38" r="5.2"/>
  <circle cx="200.17" cy="310.63" r="5.2"/>
  <circle cx="200.17" cy="333.88" r="5.2"/>
  <circle cx="200.17" cy="357.13" r="5.2"/>
  <circle cx="200.17" cy="380.38" r="5.2"/><circle cx="222.50" cy="380.38" r="5.2"/>

  <!-- I (col 6) -->
  <circle cx="244.83" cy="240.88" r="5.2"/>
  <circle cx="244.83" cy="264.13" r="5.2"/>
  <circle cx="244.83" cy="287.38" r="5.2"/>
  <circle cx="244.83" cy="310.63" r="5.2"/>
  <circle cx="244.83" cy="333.88" r="5.2"/>
  <circle cx="244.83" cy="357.13" r="5.2"/>
  <circle cx="244.83" cy="380.38" r="5.2"/>

  <!-- S (cols 7-9) -->
  <circle cx="267.17" cy="217.63" r="5.2"/><circle cx="289.50" cy="217.63" r="5.2"/><circle cx="311.83" cy="217.63" r="5.2"/>
  <circle cx="267.17" cy="240.88" r="5.2"/>
  <circle cx="267.17" cy="264.13" r="5.2"/>
  <circle cx="267.17" cy="287.38" r="5.2"/>
  <circle cx="267.17" cy="310.63" r="5.2"/><circle cx="289.50" cy="310.63" r="5.2"/><circle cx="311.83" cy="310.63" r="5.2"/>
  <circle cx="311.83" cy="333.88" r="5.2"/>
  <circle cx="311.83" cy="357.13" r="5.2"/>
  <circle cx="267.17" cy="380.38" r="5.2"/><circle cx="289.50" cy="380.38" r="5.2"/><circle cx="311.83" cy="380.38" r="5.2"/>

  <!-- A (cols 10-12) -->
  <circle cx="356.50" cy="217.63" r="5.2"/>
  <circle cx="334.17" cy="240.88" r="5.2"/><circle cx="378.83" cy="240.88" r="5.2"/>
  <circle cx="334.17" cy="264.13" r="5.2"/><circle cx="378.83" cy="264.13" r="5.2"/>
  <circle cx="334.17" cy="287.38" r="5.2"/><circle cx="356.50" cy="287.38" r="5.2"/><circle cx="378.83" cy="287.38" r="5.2"/>
  <circle cx="334.17" cy="310.63" r="5.2"/><circle cx="378.83" cy="310.63" r="5.2"/>
  <circle cx="334.17" cy="333.88" r="5.2"/><circle cx="378.83" cy="333.88" r="5.2"/>
  <circle cx="334.17" cy="357.13" r="5.2"/><circle cx="378.83" cy="357.13" r="5.2"/>
  <circle cx="334.17" cy="380.38" r="5.2"/><circle cx="378.83" cy="380.38" r="5.2"/>
</g>
<!-- Dot-to-dot connectors (ELISA) - place BEFORE the highlighted circles so dots sit on top -->
<g fill="none"
   stroke="url(#beeStrokeGrad)"
   stroke-width="10"
   stroke-linecap="round"
   stroke-linejoin="round"
   opacity="0.35">

  <!-- E : vertical spine + 3 bars (top/mid/bottom) -->
  <path d="M133.17 217.63 L133.17 240.88 L133.17 264.13 L133.17 287.38 L133.17 310.63 L133.17 333.88 L133.17 357.13 L133.17 380.38"/>
  <path d="M133.17 217.63 L155.50 217.63 L177.83 217.63"/>
  <path d="M133.17 287.38 L155.50 287.38 L177.83 287.38"/>
  <path d="M133.17 380.38 L155.50 380.38 L177.83 380.38"/>

  <!-- L : vertical + bottom foot -->
  <path d="M200.17 217.63 L200.17 240.88 L200.17 264.13 L200.17 287.38 L200.17 310.63 L200.17 333.88 L200.17 357.13 L200.17 380.38"/>
  <path d="M200.17 380.38 L222.50 380.38"/>

  <!-- I : straight down -->
  <path d="M244.83 240.88 L244.83 264.13 L244.83 287.38 L244.83 310.63 L244.83 333.88 L244.83 357.13 L244.83 380.38"/>

  <!-- S : top bar, left down, mid bar, right down, bottom bar -->
<!-- S : fully connected -->
<path d="
  M267.17 217.63 L289.50 217.63 L311.83 217.63
  M267.17 217.63 L267.17 240.88 L267.17 264.13 L267.17 287.38 L267.17 310.63
  M267.17 310.63 L289.50 310.63 L311.83 310.63
  M311.83 310.63 L311.83 333.88 L311.83 357.13 L311.83 380.38
  M267.17 380.38 L289.50 380.38 L311.83 380.38
"/>

  <!-- A : diagonals + crossbar (only between highlighted dots) -->
  <path d="M356.50 217.63 L378.83 240.88 L378.83 264.13 L378.83 287.38 L378.83 310.63 L378.83 333.88 L378.83 357.13 L378.83 380.38"/>
  <path d="M356.50 217.63 L334.17 240.88 L334.17 264.13 L334.17 287.38 L334.17 310.63 L334.17 333.88 L334.17 357.13 L334.17 380.38"/>
  <path d="M334.17 287.38 L356.50 287.38 L378.83 287.38"/>

</g>
  </g>
</svg>